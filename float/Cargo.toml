[package]
name = "csb-float"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
# 托盘。macOS 上菜单栏由 Swift App 负责，这里只在 Windows/Linux 编译进来。
[target.'cfg(not(target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[profile.release]
opt-level = "z"
lto = true
strip = true
