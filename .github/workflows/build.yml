name: 构建

on:
  push:
    branches: [zh-cn, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时要建 Release

jobs:
  build:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 工具链版本
        run: |
          swift --version
          xcodebuild -version
          cargo --version

      # 浮窗是 Rust 写的，编译较慢，缓存一下
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            float/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('float/Cargo.lock') }}

      - name: 编译
        # build.sh 会顺带编译 float/ 并把浮窗嵌进主 bundle 的 Contents/Helpers，
        # 所以最终只产出一个 .app，用户装一个就够。
        # runner 有完整 Xcode，能出 arm64 + x86_64 通用二进制。
        run: ./build.sh

      - name: 校验产物
        run: |
          APP="build/Claude Status Bar.app"
          test -d "$APP" || { echo "::error::未生成 .app"; exit 1; }

          MAIN_ARCHS="$(lipo -archs "$APP/Contents/MacOS/ClaudeStatusBar")"
          echo "主程序架构: $MAIN_ARCHS"
          case "$MAIN_ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::主程序不是通用二进制（$MAIN_ARCHS）"; exit 1 ;;
          esac

          # hooks 脚本必须打进 Resources，否则首次启动无法自装
          for f in update.js lifecycle.js install.js uninstall.js; do
            test -f "$APP/Contents/Resources/$f" || { echo "::error::缺少 $f"; exit 1; }
          done

          # 内嵌浮窗
          FLOAT="$APP/Contents/Helpers/Claude Float.app"
          test -d "$FLOAT" || { echo "::error::浮窗未嵌入"; exit 1; }
          # LSUIElement 必须为真，否则浮窗会在 Dock 里留一个图标
          test "$(defaults read "$PWD/$FLOAT/Contents/Info.plist" LSUIElement)" = "1" \
            || { echo "::error::浮窗 LSUIElement 未生效"; exit 1; }
          FLOAT_ARCHS="$(lipo -archs "$FLOAT/Contents/MacOS/csb-float")"
          echo "浮窗架构: $FLOAT_ARCHS"
          case "$FLOAT_ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::浮窗不是通用二进制（$FLOAT_ARCHS）"; exit 1 ;;
          esac

          echo "产物校验通过"

      - name: 打包
        # 用 ditto 而不是 zip：它能正确保留 .app 的符号链接和扩展属性
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "Claude Status Bar.app" ClaudeStatusBar-zh-macos.zip
          echo "大小: $(du -h ClaudeStatusBar-zh-macos.zip | cut -f1)"

      - uses: actions/upload-artifact@v5
        with:
          name: ClaudeStatusBar-zh-macos
          path: build/ClaudeStatusBar-zh-macos.zip
          retention-days: 30

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/ClaudeStatusBar-zh-macos.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "**仅 macOS**（12.0+，Intel 与 Apple Silicon 通用）。桌面浮窗已内置在 app 里，无需单独安装。

          > 本构建为 **ad-hoc 签名**（无 Apple Developer ID），首次打开会被 Gatekeeper 拦截。
          > 右键点图标 → 打开 → 再点「打开」，或执行：
          > \`xattr -dr com.apple.quarantine \"/Applications/Claude Status Bar.app\"\`"
